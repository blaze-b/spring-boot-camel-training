spring.application.name=course-enrolment-pipeline
server.port=8086

spring.datasource.url=${ENROLMENT_DB_URL:jdbc:postgresql://localhost:5432/enrolment}
spring.datasource.username=${ENROLMENT_DB_USER:enrolment}
spring.datasource.password=${ENROLMENT_DB_PASSWORD:enrolment}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

camel.springboot.main-run-controller=true

enrolment.poll.period=${ENROLMENT_POLL_PERIOD:5000}
enrolment.kafka.brokers=${KAFKA_BROKERS:localhost:9092}
enrolment.kafka.topic=${ENROLMENT_KAFKA_TOPIC:course-enrolments}
enrolment.kafka.audit-group=${ENROLMENT_KAFKA_AUDIT_GROUP:enrolment-audit}

logging.level.org.apache.camel=INFO
logging.level.com.blazeb.camel.enrolment=INFO
